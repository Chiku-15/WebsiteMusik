name: Kumpulkan data (YouTube + Spotify)

on:
  schedule:
    # 00:00 UTC = 07:00 WIB  |  12:00 UTC = 19:00 WIB
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: # tombol jalankan manual di tab Actions

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kumpulkan data YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node collect.js

      - name: Kumpulkan data Spotify (kworb + embed)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node collect_spotify.js
        # kworb/embed adalah sumber pihak ketiga — kalau sesekali gagal,
        # update data YouTube tetap jalan (data Spotify menunggu putaran berikutnya).
        continue-on-error: true

      - name: Simpan data ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ config.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: update $(TZ=Asia/Jakarta date +'%d %b %Y %H:%M WIB')"
          fi
          # Repo bisa saja berubah saat run berjalan (mis. file situs diunggah bersamaan).
          # Tarik + rebase dulu supaya push tidak ditolak "(fetch first)", lalu dorong.
          # -X theirs = kalau ada konflik, data hasil run ini (lebih baru) yang menang.
          ok=""
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              ok=1
              break
            fi
            echo "Push gagal (percobaan $i/3), mencoba lagi dalam 5 detik..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Push tetap gagal setelah 3 percobaan."
            exit 1
          fi
