name: Kumpulkan data (YouTube + Spotify)

on:
  schedule:
    # Setiap jam (WIB = UTC+7) — supaya grafik "1 hari" di situs bisa menampilkan
    # batang per jam (~24 batang). Kwantitas API YouTube tetap aman: ± 5 unit/run.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode koleksi — 'wayback-mass' = tarik riwayat nyata semua video dari arsip Wayback Machine (jalankan 1–2 jam, aman diulang bila terputus)"
        required: false
        default: normal
        type: choice
        options:
          - normal
          - wayback-mass

permissions:
  contents: write
  pages: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # mode wayback-mass menarik ±40 snapshot × 81 video dari web.archive.org (~2 jam);
    # jeda sopan antar permintaan membuatnya lambat, jadi batas waktunya dilonggar.
    # Putaran normal biasanya selesai < 10 menit — batas ini hanya pagarnya.
    timeout-minutes: 300
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kumpulkan data YouTube
        id: yt
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WAYBACK_MASS: ${{ github.event.inputs.mode == 'wayback-mass' && '1' || '' }}
        run: node collect.js
        # Kalau YouTube gagal (API key hilang / jaringan), Spotify tetap jalan dan
        # data apa pun yang berhasil dikumpulkan tetap disimpan — situs tidak macet.
        continue-on-error: true

      - name: Kumpulkan data Spotify (kworb + embed)
        id: sp
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node collect_spotify.js
        # kworb/embed adalah sumber pihak ketiga — kalau sesekali gagal,
        # update data YouTube tetap jalan (data Spotify menunggu putaran berikutnya).
        continue-on-error: true

      - name: Simpan data ke repo
        id: simpan
        if: always()
        run: |
          echo "Hasil putaran ini: YouTube=${{ steps.yt.outcome }} Spotify=${{ steps.sp.outcome }}"
          if [ "${{ steps.yt.outcome }}" = "failure" ] && [ "${{ steps.sp.outcome }}" = "failure" ]; then
            echo "::error::Kedua kolektor gagal — tidak ada data baru untuk disimpan."
          fi
          if [ "${{ steps.yt.outcome }}" = "failure" ]; then
            echo "::warning::Langkah YouTube gagal. Penyebab paling sering: secret YOUTUBE_API_KEY kosong/hilang (cek Settings → Secrets and variables → Actions) atau YouTube menolak permintaan."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ config.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: update $(TZ=Asia/Jakarta date +'%d %b %Y %H:%M WIB')"
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
          # Repo bisa saja berubah saat run berjalan (mis. file situs diunggah bersamaan).
          # Tarik + rebase dulu supaya push tidak ditolak "(fetch first)", lalu dorong.
          # -X theirs = kalau ada konflik, data hasil run ini (lebih baru) yang menang.
          ok=""
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              ok=1
              break
            fi
            echo "Push gagal (percobaan $i/3), mencoba lagi dalam 5 detik..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Push tetap gagal setelah 3 percobaan."
            exit 1
          fi

      # Kadang ada dua push ke main beruntun (mis. data bot + upload manual)
      # dan build "pages build and deployment" saling membatalkan
      # ("Canceling since a higher priority waiting request ... exists") sampai
      # tidak ada yang men-deploy — situs pun tetap memuat data lama.
      # Solusi: setelah jeda, minta satu build Pages secara eksplisit lewat API
      # supaya data terbaru pasti tayang.
      - name: Pastikan GitHub Pages ikut ter-deploy
        if: ${{ steps.simpan.outputs.changed == '1' }}
        run: |
          sleep 75
          for i in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1; then
              echo "Build GitHub Pages diminta ulang — data terbaru akan segera tayang."
              exit 0
            fi
            echo "Gagal meminta build Pages (percobaan $i/3), coba lagi dalam 10 detik..."
            sleep 10
          done
          echo "::warning::Tidak bisa meminta build Pages lewat API. Kalau situs belum memuat data terbaru, buka run “pages build and deployment” terakhir di tab Actions lalu klik Re-run jobs (atau push satu commit kecil ke main)."
        env:
          GH_TOKEN: ${{ github.token }}
